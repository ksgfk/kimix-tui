[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kimix-tui"
version = "0.1.0"
description = "A keyboard-first Textual client for the public Kimi Agent SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kimix>=0.1.29",
    "orjson>=3.11.9",
    "textual>=8.2,<9",
]

[tool.uv.sources]
kimix = { path = "../Kimi-CLI-X", editable = true }

[project.scripts]
kimix-tui = "kimix_tui.__main__:main"

[project.optional-dependencies]
all = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kimix_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
